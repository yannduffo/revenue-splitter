services:
  postgres:
    image: postgres:17-alpine
    container_name: splittr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: splittr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: splittr
    volumes:
      - pgdata:/var/lib/postgresql/data
      # executed once, when the volume is empty
      - ./indexer/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splittr -d splittr"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no ports : only the other containers can reach it, through the compose network

  indexer:
    build: ./indexer
    image: splittr-indexer:latest
    container_name: splittr-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RPC_URL: ${INDEXER_RPC_URL}
      DATABASE_URL: postgres://splittr:${POSTGRES_PASSWORD}@postgres:5432/splittr
      FACTORY_ADDRESS: ${NEXT_PUBLIC_SEPOLIA_FACTORY}
      FACTORY_BLOCK: ${SEPOLIA_FACTORY_BLOCK}
    #SIGTERM lets the current tick finished: a catchup tick can take a few seconds
    stop_grace_period: 60s

  splittr:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SEPOLIA_FACTORY: ${NEXT_PUBLIC_SEPOLIA_FACTORY}
        NEXT_PUBLIC_SEPOLIA_IMPLEMENTATION: ${NEXT_PUBLIC_SEPOLIA_IMPLEMENTATION}
        NEXT_PUBLIC_SEPOLIA_DEMO_SPLITTER_A: ${NEXT_PUBLIC_SEPOLIA_DEMO_SPLITTER_A}
        NEXT_PUBLIC_SEPOLIA_DEMO_SPLITTER_B: ${NEXT_PUBLIC_SEPOLIA_DEMO_SPLITTER_B}
        NEXT_PUBLIC_SEPOLIA_DEMO_TOKENS: ${NEXT_PUBLIC_SEPOLIA_DEMO_TOKENS}
    image: splittr:latest
    container_name: splittr
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INFURA_API_KEY: ${INFURA_API_KEY}
      DATABASE_URL: postgres://splittr:${POSTGRES_PASSWORD}@postgres:5432/splittr
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  pgdata:
